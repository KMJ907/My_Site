<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY DEV HUB | 나만의 웹사이트 모음</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --text-muted: #6c757d;
      --primary-color: #0d6efd;
      --border-color: #e9ecef;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 8px 15px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 2.2rem; margin-bottom: 0.5rem; font-weight: 700; }
    header p { color: var(--text-muted); margin-bottom: 1.5rem; }

    .search-box {
      position: relative;
      max-width: 500px;
      margin: 0 auto 1.5rem auto;
    }

    .search-box input {
      width: 100%;
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      border: 2px solid var(--border-color);
      border-radius: 30px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: var(--card-bg);
    }

    .search-box input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
    }

    .category-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .cat-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-btn:hover { border-color: var(--primary-color); color: var(--primary-color); }
    .cat-btn.active { background-color: var(--primary-color); color: #ffffff; border-color: var(--primary-color); }

    .site-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
    }

    .site-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      box-shadow: var(--shadow);
    }

    .site-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary-color);
    }

    .site-info { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .site-icon { width: 24px; height: 24px; border-radius: 4px; object-fit: cover; }
    .site-title { font-size: 1.1rem; font-weight: 600; }
    .site-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .site-tag {
      display: inline-block;
      margin-top: 0.75rem;
      font-size: 0.75rem;
      background-color: var(--bg-color);
      color: var(--text-muted);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      align-self: flex-start;
    }

    .no-results { grid-column: 1 / -1; text-align: center; padding: 3rem 0; color: var(--text-muted); display: none; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>나만의 웹 디렉토리</h1>
      <p>자주 방문하는 사이트 모음집입니다.</p>
      
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="사이트 이름, 설명, 태그로 검색..." autocomplete="off">
      </div>

      <div class="category-container" id="categoryContainer"></div>
    </header>

    <main class="site-grid" id="siteGrid"></main>

    <div class="no-results" id="noResults">검색 결과가 없습니다.</div>
  </div>

  <script>
    let categories = [];
    let sites = [];
    let currentCategoryId = 'all';

    const siteGrid = document.getElementById('siteGrid');
    const searchInput = document.getElementById('searchInput');
    const noResults = document.getElementById('noResults');
    const categoryContainer = document.getElementById('categoryContainer');

    // 1. 카테고리 & 사이트 JSON 로드
    Promise.all([
      fetch('category.json').then(res => res.json()),
      fetch('sites.json').then(res => res.json())
    ])
    .then(([catData, siteData]) => {
      categories = catData.sort((a, b) => a.order - b.order);
      sites = siteData;

      initCategoryButtons();
      filterAndRender();
    })
    .catch(error => {
      console.error('데이터 로드 실패:', error);
      siteGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">데이터(JSON)를 불러오는 중 오류가 발생했습니다.</p>';
    });

    // 2. 카테고리 버튼 생성
    function initCategoryButtons() {
      categoryContainer.innerHTML = '';

      const allBtn = createCatButton('all', '전체', true);
      categoryContainer.appendChild(allBtn);

      categories.forEach(cat => {
        const btn = createCatButton(cat.id, cat.name, false);
        categoryContainer.appendChild(btn);
      });
    }

    function createCatButton(id, name, isActive) {
      const btn = document.createElement('button');
      btn.className = `cat-btn ${isActive ? 'active' : ''}`;
      btn.textContent = name;

      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategoryId = id;
        filterAndRender();
      });

      return btn;
    }

    // 헬퍼 함수: icon 값이 없을 때 사이트 URL에서 Google Favicon URL 추출
    function getFaviconUrl(site) {
      if (site.icon && site.icon.trim() !== '') {
        return site.icon.trim();
      }
      try {
        const domain = new URL(site.url).hostname;
        return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
      } catch (e) {
        return 'https://via.placeholder.com/24?text=W';
      }
    }

    // 3. 카드 렌더링
    function renderSites(siteList) {
      siteGrid.innerHTML = '';

      if (siteList.length === 0) {
        noResults.style.display = 'block';
        return;
      }

      noResults.style.display = 'none';

      siteList.forEach(site => {
        const card = document.createElement('a');
        card.className = 'site-card';
        card.href = site.url;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';

        // 아이콘 URL 결정 (공백 체크)
        const iconSrc = getFaviconUrl(site);

        card.innerHTML = `
          <div>
            <div class="site-info">
              <img src="${iconSrc}" alt="${site.name} 파비콘" class="site-icon" onerror="this.src='https://via.placeholder.com/24?text=W'">
              <span class="site-title">${site.name}</span>
            </div>
            <p class="site-desc">${site.desc}</p>
          </div>
          <span class="site-tag">#${site.tag}</span>
        `;

        siteGrid.appendChild(card);
      });
    }

    // 4. 복합 필터링 (카테고리 ID + 검색어)
    function filterAndRender() {
      const query = searchInput.value.toLowerCase().trim();

      const filtered = sites.filter(site => {
        const matchesCategory = (currentCategoryId === 'all') || (site.categoryId === currentCategoryId);
        const matchesQuery = site.name.toLowerCase().includes(query) ||
                             site.desc.toLowerCase().includes(query) ||
                             site.tag.toLowerCase().includes(query);

        return matchesCategory && matchesQuery;
      });

      renderSites(filtered);
    }

    searchInput.addEventListener('input', filterAndRender);
  </script>
</body>
</html>
