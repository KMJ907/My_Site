<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Links</title>

<style>

:root{

    --primary:#4F46E5;
    --primary-hover:#4338CA;

    --background:#F5F7FB;

    --card:#FFFFFF;

    --text:#202124;

    --sub:#6B7280;

    --border:#E5E7EB;

    --shadow:0 8px 24px rgba(0,0,0,.06);

    --radius:18px;

}

*{

    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
    Pretendard,
    "Noto Sans KR",
    sans-serif;

}

html{

    scroll-behavior:smooth;

}

body{

    background:var(--background);
    color:var(--text);

}

button{

    border:none;
    cursor:pointer;

}

input{

    border:none;
    outline:none;

}

a{

    color:inherit;
    text-decoration:none;

}

.container{

    width:min(1450px,95%);
    margin:auto;

}

/* ===========================
HEADER
=========================== */

header{

    position:sticky;

    top:0;

    z-index:999;

    background:rgba(255,255,255,.92);

    backdrop-filter:blur(10px);

    border-bottom:1px solid var(--border);

}

.header{

    padding:22px 0;

}

.logo{

    display:flex;

    align-items:center;

    gap:14px;

    margin-bottom:20px;

}

.logo span{

    font-size:34px;

}

.logo h1{

    font-size:30px;

    font-weight:800;

}

.logo p{

    color:var(--sub);

    font-size:14px;

    margin-top:3px;

}

/* ===========================
SEARCH
=========================== */

.search{

    position:relative;

}

.search input{

    width:100%;

    height:56px;

    border-radius:16px;

    border:1px solid var(--border);

    padding-left:58px;

    padding-right:18px;

    font-size:16px;

    transition:.2s;

}

.search input:focus{

    border-color:var(--primary);

    box-shadow:0 0 0 4px rgba(79,70,229,.12);

}

.search svg{

    position:absolute;

    left:18px;

    top:50%;

    transform:translateY(-50%);

    width:22px;

    height:22px;

    fill:#999;

}

/* ===========================
CATEGORY
=========================== */

.categories{

    display:flex;

    gap:10px;

    margin:24px 0;

    overflow-x:auto;

    scrollbar-width:none;

}

.categories::-webkit-scrollbar{

    display:none;

}

.category{

    padding:10px 18px;

    border-radius:999px;

    border:1px solid var(--border);

    background:white;

    transition:.2s;

    white-space:nowrap;

    cursor:pointer;

}

.category:hover{

    background:var(--primary);

    color:white;

    border-color:var(--primary);

}

.category.active{

    background:var(--primary);

    color:white;

    border-color:var(--primary);

}

/* ===========================
INFO
=========================== */

.info{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin:18px 0 28px;

    color:var(--sub);

    font-size:14px;

}

/* ===========================
GRID
=========================== */

.grid{

    display:grid;

    grid-template-columns:

    repeat(auto-fill,minmax(280px,1fr));

    gap:22px;

    padding-bottom:60px;

}

/* ===========================
CARD
=========================== */

.card{

    background:white;

    border-radius:var(--radius);

    border:1px solid var(--border);

    box-shadow:var(--shadow);

    padding:22px;

    cursor:pointer;

    transition:.25s;

}

.card:hover{

    transform:translateY(-6px);

}

.card-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:18px;

}

.card-icon{

    width:54px;

    height:54px;

    border-radius:14px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#EEF2FF;

    font-size:28px;

}

.favorite{

    font-size:20px;

}

.card-title{

    font-size:21px;

    font-weight:700;

    margin-bottom:8px;

}

.card-desc{

    color:var(--sub);

    line-height:1.5;

    margin-bottom:14px;

    min-height:42px;

}

.card-url{

    font-size:13px;

    color:#999;

    word-break:break-all;

}

.empty{

    display:none;

    text-align:center;

    padding:80px;

    color:#888;

}

footer{

    text-align:center;

    padding:40px;

    color:#888;

}

/* ===========================
MOBILE
=========================== */

@media(max-width:700px){

.logo h1{

font-size:24px;

}

.logo span{

font-size:28px;

}

.grid{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<header>

<div class="container header">

<div class="logo">

<span>🌐</span>

<div>

<h1>My Links</h1>

<p>나만의 사이트 모음</p>

</div>

</div>

<div class="search">

<input
id="searchInput"
type="text"
placeholder="사이트 검색 (Ctrl + K)"
>

<svg viewBox="0 0 24 24">

<path d="M21 21l-5.2-5.2m2.2-5.3a7 7 0 1 1-14 0a7 7 0 0 1 14 0"/>

</svg>

</div>

<div
class="categories"
id="categories">

</div>

</div>

</header>

<main class="container">

<div class="info">

<div id="siteCount">
사이트 0개
</div>

<div id="currentCategory">
전체
</div>

</div>

<div
class="grid"
id="grid">

</div>

<div
class="empty"
id="empty">

검색 결과가 없습니다.

</div>

</main>

<footer>

Made with ❤️

</footer>

<script>

  // ===========================
// My Links
// JavaScript
// Part 2
// ===========================

// ---------------------------
// 전역 변수
// ---------------------------

let allSites = [];
let filteredSites = [];
let currentCategory = "전체";

// ---------------------------
// DOM
// ---------------------------

const grid = document.getElementById("grid");
const empty = document.getElementById("empty");

const searchInput = document.getElementById("searchInput");

const categories = document.getElementById("categories");

const siteCount = document.getElementById("siteCount");

const currentCategoryText =
document.getElementById("currentCategory");

// ---------------------------
// JSON 불러오기
// ---------------------------

async function loadSites(){

    try{

        const response = await fetch("sites.json");

        if(!response.ok){

            throw new Error("sites.json을 찾을 수 없습니다.");

        }

        const data = await response.json();

        allSites = data.sites || [];

        filteredSites = [...allSites];

        createCategories(data.categories || []);

        renderCards(filteredSites);

    }

    catch(error){

        console.error(error);

        grid.innerHTML = "";

        empty.style.display = "block";

        empty.innerHTML =
        "sites.json을 불러오지 못했습니다.";

    }

}

// ---------------------------
// 카드 생성
// ---------------------------

function renderCards(list){

    grid.innerHTML = "";

    if(list.length===0){

        empty.style.display="block";

        siteCount.textContent="사이트 0개";

        return;

    }

    empty.style.display="none";

    siteCount.textContent=
    `사이트 ${list.length}개`;

    list.forEach(site=>{

        const card=document.createElement("div");

        card.className="card";

        card.onclick=()=>{

            window.open(site.url,"_blank");

        };

        card.innerHTML=`

<div class="card-top">

<div class="card-icon">

${site.icon || "🌐"}

</div>

<div class="favorite">

${site.favorite ? "⭐" : ""}

</div>

</div>

<div class="card-title">

${site.name}

</div>

<div class="card-desc">

${site.description}

</div>

<div class="card-url">

${site.url}

</div>

`;

        grid.appendChild(card);

    });

}

// ---------------------------
// 카테고리 생성
// ---------------------------

function createCategories(list){

    categories.innerHTML="";

    const allButton=document.createElement("button");

    allButton.className="category active";

    allButton.textContent="전체";

    allButton.onclick=()=>{

        selectCategory("전체");

    };

    categories.appendChild(allButton);

    list.forEach(category=>{

        const button=document.createElement("button");

        button.className="category";

        button.textContent=category;

        button.onclick=()=>{

            selectCategory(category);

        };

        categories.appendChild(button);

    });

}

// ---------------------------
// 카테고리 선택
// ---------------------------

function selectCategory(category){

    currentCategory=category;

    currentCategoryText.textContent=category;

    document
    .querySelectorAll(".category")
    .forEach(button=>{

        button.classList.remove("active");

        if(button.textContent===category){

            button.classList.add("active");

        }

    });

    filterSites();

}



  // ===========================
// 검색 + 필터
// ===========================

function filterSites() {

    const keyword = searchInput.value
        .trim()
        .toLowerCase();

    filteredSites = allSites.filter(site => {

        const matchCategory =
            currentCategory === "전체" ||
            site.category === currentCategory;

        const matchKeyword =
            site.name.toLowerCase().includes(keyword) ||
            site.description.toLowerCase().includes(keyword) ||
            site.url.toLowerCase().includes(keyword);

        return matchCategory && matchKeyword;

    });

    renderCards(filteredSites);

}

// ===========================
// 검색 이벤트
// ===========================

searchInput.addEventListener("input", filterSites);

// ===========================
// Ctrl + K
// ===========================

document.addEventListener("keydown", e => {

    if (e.ctrlKey && e.key.toLowerCase() === "k") {

        e.preventDefault();

        searchInput.focus();

        searchInput.select();

    }

});

// ===========================
// ESC
// ===========================

searchInput.addEventListener("keydown", e => {

    if (e.key === "Escape") {

        searchInput.value = "";

        filterSites();

    }

});

// ===========================
// 시작
// ===========================

loadSites();

</script>

</body>

</html>
