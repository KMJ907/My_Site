<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY DEV HUB | 나만의 웹사이트 모음</title>
  <style>
    /* Reset & CSS Variables */
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --text-muted: #6c757d;
      --primary-color: #0d6efd;
      --border-color: #e9ecef;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 8px 15px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Header & Search */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    header p {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .search-box {
      position: relative;
      max-width: 500px;
      margin: 0 auto;
    }

    .search-box input {
      width: 100%;
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      border: 2px solid var(--border-color);
      border-radius: 30px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: var(--card-bg);
    }

    .search-box input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
    }

    /* Grid Layout */
    .site-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
    }

    /* Card Item */
    .site-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      box-shadow: var(--shadow);
    }

    .site-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary-color);
    }

    .site-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .site-icon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      object-fit: cover;
    }

    .site-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .site-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .site-tag {
      display: inline-block;
      margin-top: 0.75rem;
      font-size: 0.75rem;
      background-color: var(--bg-color);
      color: var(--text-muted);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      align-self: flex-start;
    }

    /* Empty State */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 0;
      color: var(--text-muted);
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>나만의 웹 디렉토리</h1>
      <p>자주 방문하는 사이트 모음집입니다.</p>
      
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="사이트 이름, 설명, 태그로 검색..." autocomplete="off">
      </div>
    </header>

    <main class="site-grid" id="siteGrid">
      <!-- 사이트 카드는 JavaScript에 의해 자동으로 생성됩니다. -->
    </main>

    <div class="no-results" id="noResults">
      검색 결과가 없습니다.
    </div>
  </div>

  <script>
    // 1. 사이트 데이터 (추후 sites.html 혹은 외부 JSON 파일로 분리/연동 가능)
    const sites = [
      {
        name: "네이버",
        url: "https://www.naver.com",
        desc: "대한민국 대표 포털 사이트",
        tag: "포털",
        icon: "https://www.google.com/s2/favicons?domain=naver.com&sz=64"
      },
      {
        name: "구글",
        url: "https://www.google.com",
        desc: "전 세계 최대 검색 엔진",
        tag: "검색",
        icon: "https://www.google.com/s2/favicons?domain=google.com&sz=64"
      },
      {
        name: "GitHub",
        url: "https://github.com",
        desc: "소프트웨어 개발 및 코드 호스팅 플랫폼",
        tag: "개발",
        icon: "https://www.google.com/s2/favicons?domain=github.com&sz=64"
      },
      {
        name: "유튜브",
        url: "https://www.youtube.com",
        desc: "글로벌 동영상 공유 플랫폼",
        tag: "미디어",
        icon: "https://www.google.com/s2/favicons?domain=youtube.com&sz=64"
      },
      {
        name: "ChatGPT",
        url: "https://chatgpt.com",
        desc: "OpenAI 대화형 인공지능 서비스",
        tag: "AI",
        icon: "https://www.google.com/s2/favicons?domain=chatgpt.com&sz=64"
      }
    ];

    // 2. DOM 요소
    const siteGrid = document.getElementById('siteGrid');
    const searchInput = document.getElementById('searchInput');
    const noResults = document.getElementById('noResults');

    // 3. 카드 렌더링 함수
    function renderSites(siteList) {
      siteGrid.innerHTML = '';

      if (siteList.length === 0) {
        noResults.style.display = 'block';
        return;
      }

      noResults.style.display = 'none';

      siteList.forEach(site => {
        const card = document.createElement('a');
        card.className = 'site-card';
        card.href = site.url;
        card.target = '_blank'; // 새 탭에서 열기
        card.rel = 'noopener noreferrer'; // 보안 최적화

        card.innerHTML = `
          <div>
            <div class="site-info">
              <img src="${site.icon}" alt="${site.name} 파비콘" class="site-icon" onerror="this.src='https://via.placeholder.com/24?text=W'">
              <span class="site-title">${site.name}</span>
            </div>
            <p class="site-desc">${site.desc}</p>
          </div>
          <span class="site-tag">#${site.tag}</span>
        `;

        siteGrid.appendChild(card);
      });
    }

    // 4. 실시간 검색 기능 (이름, 설명, 태그 통합 검색)
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      
      const filteredSites = sites.filter(site => {
        return site.name.toLowerCase().includes(query) ||
               site.desc.toLowerCase().includes(query) ||
               site.tag.toLowerCase().includes(query);
      });

      renderSites(filteredSites);
    });

    // 초기에 전체 데이터 렌더링
    renderSites(sites);
  </script>
</body>
</html>
